<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SignalPack Signal Flare logo</title>
  <desc id="desc">A bright central node emitting radar-like arcs with a cyan, blue, violet, and orange signal flare.</desc>
  <defs>
    <linearGradient id="arc" x1="72" x2="440" y1="140" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#3B82F6"/>
      <stop offset=".84" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="alert" x1="382" x2="462" y1="178" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="core" cx="210" cy="330" r="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".25" stop-color="#A5F3FC"/>
      <stop offset=".62" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.82 0 0 0 0 0.93 0 0 0 0.95 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#070B14"/>
  <path d="M76 446h272" stroke="#1D4ED8" stroke-width="9" stroke-linecap="round" opacity=".42"/>
  <path d="M139 418h140" stroke="#22D3EE" stroke-width="7" stroke-linecap="round" opacity=".74"/>
  <g filter="url(#glow)">
    <circle cx="210" cy="330" r="118" fill="#081527" stroke="#2563EB" stroke-width="9"/>
    <circle cx="210" cy="330" r="78" fill="url(#core)"/>
    <circle cx="210" cy="330" r="33" fill="#E0F2FE"/>
    <path d="M118 293a139 139 0 0 1 139-139" fill="none" stroke="#22D3EE" stroke-width="16" stroke-linecap="round" opacity=".92"/>
    <path d="M86 266a193 193 0 0 1 193-193" fill="none" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round" opacity=".72"/>
    <path d="M56 241A246 246 0 0 1 302-5" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" opacity=".5"/>
    <path d="M210 56c117 0 212 95 212 212H290c0-44-36-80-80-80V56Z" fill="url(#arc)"/>
    <path d="M308 270h118c0-46-13-91-37-130" fill="none" stroke="url(#alert)" stroke-width="29" stroke-linecap="round"/>
    <path d="M210 56c90 0 169 57 199 140" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" opacity=".82"/>
    <path d="M210 156c57 0 107 36 126 88" fill="none" stroke="#A78BFA" stroke-width="31" stroke-linecap="round" opacity=".58"/>
    <path d="M222 310 410 121" stroke="#0F1115" stroke-width="59" stroke-linecap="round" opacity=".88"/>
    <path d="M229 303 418 114" stroke="#1E40AF" stroke-width="37" stroke-linecap="round"/>
    <path d="M229 303 418 114" stroke="#38BDF8" stroke-width="13" stroke-linecap="round" opacity=".82"/>
  </g>
</svg>
